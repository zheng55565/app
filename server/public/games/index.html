<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <title>HuanYouYu</title>
    <style>
      html, body { margin:0; padding:0; width:100%; height:100%; background:#14121a; overflow:hidden; }
      #unity-canvas { width:100%; height:100%; display:block; background:#14121a; }
      #loading { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
                 justify-content:center; gap:14px; color:#8b87a0; font:14px system-ui,sans-serif; }
      #bar { width:60%; max-width:280px; height:6px; background:#2c2840; border-radius:3px; overflow:hidden; }
      #fill { width:0%; height:100%; background:#7c4dff; border-radius:3px; transition:width .2s; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div>小游戏加载中…</div>
      <div id="bar"><div id="fill"></div></div>
    </div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      // ==== 微信小游戏 SDK 兼容层 ====
      // 项目内置的 WX-WASM-SDK 会把存档（PlayerPrefs）重定向到
      // window.WXWASMSDK.WXStorage*（仅微信环境存在）。标准 WebGL 跑在
      // App WebView 里没有这个对象，引擎启动读存档即崩。
      // 这里用 localStorage 实现存储接口（存档功能完整），其余微信专属
      // 接口经 Proxy 返回无害空实现。
      (function () {
        var impl = {
          WXStorageSetIntSync:    function (k, v) { localStorage.setItem(k, String(v)); },
          WXStorageGetIntSync:    function (k, d) { var v = localStorage.getItem(k); return v === null ? Number(d) || 0 : Number(v) || 0; },
          WXStorageSetFloatSync:  function (k, v) { localStorage.setItem(k, String(v)); },
          WXStorageGetFloatSync:  function (k, d) { var v = localStorage.getItem(k); return v === null ? Number(d) || 0 : Number(v) || 0; },
          WXStorageSetStringSync: function (k, v) { localStorage.setItem(k, v === undefined || v === null ? '' : String(v)); },
          WXStorageGetStringSync: function (k, d) { var v = localStorage.getItem(k); return v === null ? (d === undefined || d === null ? '' : String(d)) : v; },
          WXStorageDeleteAllSync: function () { localStorage.clear(); },
          WXStorageDeleteKeySync: function (k) { localStorage.removeItem(k); },
          WXStorageHasKeySync:    function (k) { return localStorage.getItem(k) !== null; }
        };
        window.WXWASMSDK = new Proxy(impl, {
          get: function (target, prop) {
            if (prop in target) return target[prop];
            // 未实现的微信接口：返回空函数，避免 undefined 调用崩溃
            return function () { return ''; };
          }
        });
      })();

      // 联调：把页面里的 JS 错误与 Unity 加载失败上报到后端日志
      function reportError(kind, detail) {
        try {
          fetch('client-log', { method: 'POST', body: kind + ': ' + detail });
        } catch (e) {}
      }
      window.addEventListener('error', function (e) {
        reportError('window.error',
          (e.message || '') + ' @' + (e.filename || '') + ':' + (e.lineno || 0));
      });
      window.addEventListener('unhandledrejection', function (e) {
        reportError('unhandledrejection', String(e.reason).slice(0, 2000));
      });

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "HuanYouYu",
        productVersion: "1.0",
      }, function (progress) {
        document.getElementById("fill").style.width = (progress * 100) + "%";
      }).then(function (instance) {
        // 关键：暴露给 GongyiAppBridge.jslib，App 回执经此转发进 Unity
        window.unityInstance = instance;
        document.getElementById("loading").style.display = "none";
      }).catch(function (message) {
        // 只显示错误摘要（完整错误常带整段源码，会刷满屏幕）
        var text = String(message);
        reportError('createUnityInstance.catch', text.slice(0, 4000));
        if (text.length > 400) text = text.slice(0, 400) + ' …(截断)';
        document.getElementById("loading").firstElementChild.textContent =
          "加载失败：" + text;
        console.error('[games] createUnityInstance failed:', message);
      });
    </script>
  </body>
</html>
